<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VOKO7 – شارك الأكواد والنصوص</title>
<meta name="google-site-verification" content="QTnHaH_geROvIRZIXa_6c1qqxI8WrP5S_C1jRJrT7NA" />
<style>
:root{--bg:#f5f5f5;--card:#fff;--fg:#111;--mut:#6b7280;--line:#d1d5db;--pri:#6d8bff;--pri-d:#4f6df0;--code:#0f9b8e;--gut:#ececec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171c;--card:#1f1f26;--fg:#f3f4f6;--mut:#9ca3af;--line:#3a3a45;--gut:#26262e;--code:#4fd1c5}}
:root[data-theme="dark"]{--bg:#17171c;--card:#1f1f26;--fg:#f3f4f6;--mut:#9ca3af;--line:#3a3a45;--gut:#26262e;--code:#4fd1c5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-size:36px;font-weight:900;letter-spacing:1px;color:#fff;-webkit-text-stroke:1.5px #111;paint-order:stroke fill;text-shadow:2px 2px 0 #c4b5fd;font-family:Arial,sans-serif;cursor:pointer;direction:ltr}
.ib{background:none;border:0;color:var(--fg);font-size:26px;cursor:pointer;padding:6px 10px;border-radius:8px}
.ib:hover{background:var(--gut)}
input.name{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:16px;margin-bottom:12px;direction:ltr;text-align:left}
.editor{display:flex;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;direction:ltr}
.gut{background:var(--gut);color:var(--mut);padding:12px 10px;text-align:right;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;user-select:none;min-width:44px;white-space:pre;overflow:hidden}
textarea.ta{flex:1;border:0;outline:0;resize:vertical;min-height:300px;padding:12px;background:transparent;color:var(--fg);font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto;direction:ltr;text-align:left}
.row{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;padding:14px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:17px;cursor:pointer;font-family:inherit}
.btn:hover:not(:disabled){background:var(--pri-d)}.btn:disabled{opacity:.5;cursor:not-allowed}
.sq{width:52px;flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;font-size:20px;cursor:pointer}
.tools{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 14px;border-radius:10px;cursor:pointer;font-size:15px;font-family:inherit;text-decoration:none;display:inline-block}
.tool.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.title{direction:ltr;text-align:left;color:var(--mut);margin:0 0 10px;font-size:15px}
pre.view{margin:0;padding:12px;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--code);white-space:pre;overflow:auto;direction:ltr;text-align:left;flex:1;min-width:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.recent h3{margin:24px 0 8px;font-size:16px;color:var(--mut)}
.item{display:flex;justify-content:space-between;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px;cursor:pointer}
.item span:first-child{direction:ltr}.item span:nth-child(2){color:var(--mut);font-size:13px}
.msg{text-align:center;color:var(--mut);padding:40px 0}
footer{margin-top:40px;text-align:center;color:var(--mut);font-size:13px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.box{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:380px}
.box input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font-size:16px;margin-bottom:10px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer;font-family:inherit;font-size:15px}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.hi{margin:0 0 12px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="ib" id="acc" title="الحساب">👤</button>
    <div class="logo" id="logo">VOKO7</div>
    <button class="ib" id="newBtn" title="جديد">＋</button>
  </header>
  <main id="app"></main>
  <footer>VOKO7 — الصق الكود، اضغط نشر، وشارك الرابط</footer>
</div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   حط هنا رابط الـ Worker بتاعك (اللي بيطلع من Cloudflare)
   ============================================================ */
var API="https://zx67.edxrf7.workers.dev";

(function(){
API=API.replace(/\/+$/,'');
var app=document.getElementById('app'),toastEl=document.getElementById('toast');
function $(s){return document.querySelector(s)}
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(function(){toastEl.classList.remove('show')},1800)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function lines(t){var n=t.split('\n').length,a=[];for(var i=1;i<=n;i++)a.push(i);return a.join('\n')}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function copy(t){
  function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('تم النسخ ✓')}catch(e){toast('تعذر النسخ')}a.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('تم النسخ ✓')},fb);else fb();
}

/* ===== الاتصال بالسيرفر (Worker) ===== */
function api(path,body,method){
  return fetch(API+path,{
    method:method||(body?'POST':'GET'),
    headers:{'content-type':'application/json','Authorization':'Bearer '+(lsGet('v7t')||'')},
    body:body?JSON.stringify(body):undefined
  }).then(function(r){
    return r.json().catch(function(){return{}}).then(function(j){
      if(!r.ok){var er=new Error(j.error||'حدث خطأ');er.status=r.status;throw er}
      return j;
    });
  });
}
function me(){var t=lsGet('v7t'),n=lsGet('v7n');return t&&n?{name:n,email:lsGet('v7e')||''}:null}
function clearSession(){lsDel('v7t');lsDel('v7n');lsDel('v7e')}

var pre=null;
function modal(html){var m=document.createElement('div');m.className='modal';m.innerHTML='<div class="box">'+html+'</div>';m.onclick=function(e){if(e.target===m)m.remove()};document.body.appendChild(m);return m}
function setAcc(){var u=me();$('#acc').textContent=u?'✅':'👤';$('#acc').title=u?u.name:'الحساب'}
function refresh(){setAcc();route()}

function authModal(tab){
  var m=modal('<div class="tabs"><button class="tab" id="t1">تسجيل دخول</button><button class="tab" id="t2">إنشاء حساب</button></div>'+
    '<input id="nm" placeholder="الاسم"><input id="em" type="email" dir="ltr" placeholder="البريد الإلكتروني" autocomplete="email"><input id="pw" type="password" dir="ltr" placeholder="كلمة السر" autocomplete="current-password"><button class="btn" id="go" style="width:100%"></button>');
  var up=tab==='up';
  function set(){m.querySelector('#nm').style.display=up?'':'none';m.querySelector('#t1').classList.toggle('on',!up);m.querySelector('#t2').classList.toggle('on',up);m.querySelector('#go').textContent=up?'إنشاء الحساب':'دخول'}
  set();
  m.querySelector('#t1').onclick=function(){up=false;set()};
  m.querySelector('#t2').onclick=function(){up=true;set()};
  m.querySelector('#go').onclick=async function(){
    var b=m.querySelector('#go'),em=m.querySelector('#em').value.trim().toLowerCase(),pw=m.querySelector('#pw').value,nm=m.querySelector('#nm').value.trim();
    if(!em||!pw)return toast('اكتب البريد وكلمة السر');
    if(up){if(!nm)return toast('اكتب الاسم');if(pw.length<6)return toast('كلمة السر 6 حروف على الأقل')}
    b.disabled=true;
    try{
      var j=await api(up?'/api/signup':'/api/login',{name:nm,email:em,password:pw});
      lsSet('v7t',j.token);lsSet('v7n',j.name);lsSet('v7e',em);
      m.remove();refresh();
    }catch(e){toast(e.status?e.message:'تعذر الاتصال بالسيرفر');b.disabled=false}
  };
}
function accModal(){
  var u=me(),m=modal('<p style="margin:0 0 4px;text-align:center;font-size:18px">'+esc(u.name)+'</p><p style="margin:0 0 14px;text-align:center;color:var(--mut);direction:ltr">'+esc(u.email)+'</p><button class="btn" id="lo" style="width:100%">تسجيل خروج</button>');
  m.querySelector('#lo').onclick=function(){api('/api/logout',{}).catch(function(){});clearSession();m.remove();refresh()};
}

/* ===== الصفحة الرئيسية ===== */
function home(){
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
  var u=me(),p=pre;pre=null;
  app.innerHTML='<p class="hi">'+(u?'أهلاً '+esc(u.name)+' 👋':'سجّل دخول عشان تحفظ لصقاتك وترجعلها 👤')+'</p>'+
  '<input class="name" id="fname" placeholder="file.js" dir="ltr">'+
  '<div class="editor"><div class="gut" id="gut">1</div><textarea class="ta" id="ta" placeholder="ألصق هنا" spellcheck="false"></textarea></div>'+
  '<div class="row"><button class="btn" id="send" disabled>نشر</button><button class="sq" id="clr" title="مسح">🗑</button></div>'+
  '<div class="recent" id="recent"></div>';
  var ta=$('#ta'),gut=$('#gut'),send=$('#send');
  function upd(){gut.textContent=lines(ta.value);send.disabled=!ta.value.trim()}
  if(p){$('#fname').value=p.n;ta.value=p.x;upd()}
  ta.addEventListener('input',upd);
  ta.addEventListener('scroll',function(){gut.scrollTop=ta.scrollTop});
  ta.addEventListener('keydown',function(e){if(e.key==='Tab'){e.preventDefault();var s=ta.selectionStart;ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=s+2;upd()}});
  $('#clr').onclick=function(){ta.value='';upd()};
  send.onclick=async function(){
    if(!me())return authModal('in');
    send.disabled=true;send.textContent='جارٍ النشر...';
    try{
      var j=await api('/api/paste',{id:p&&p.h,title:$('#fname').value.trim()||'file.txt',content:ta.value});
      location.hash=j.id;
    }catch(e){
      if(e.status===401){clearSession();refresh();toast('انتهت الجلسة، سجّل دخول من جديد');return}
      toast(e.status?e.message:'تعذر الاتصال بالسيرفر');send.disabled=false;send.textContent='نشر';
    }
  };
  if(u)api('/api/mine').then(function(j){
    var r=j.items||[];if(!r.length)return;
    var h='<h3>منشوراتي</h3>';
    r.forEach(function(x,i){h+='<div class="item" data-i="'+i+'"><span>'+esc(x.t||'file')+'</span><span>'+(x.d?new Date(x.d).toLocaleDateString('ar-EG'):'')+'</span><span data-d="'+i+'">🗑</span></div>'});
    $('#recent').innerHTML=h;
    document.querySelectorAll('.item').forEach(function(el){el.onclick=function(){location.hash=r[+el.dataset.i].id}});
    document.querySelectorAll('[data-d]').forEach(function(el){el.onclick=function(e){
      e.stopPropagation();
      if(confirm('تحذف المنشور ده؟'))api('/api/paste/'+r[+el.dataset.d].id,null,'DELETE').then(function(){home()}).catch(function(x){toast(x.message)});
    }});
  }).catch(function(e){if(e.status===401){clearSession();refresh()}});
}

/* ===== صفحة عرض المنشور ===== */
async function show(h){
  app.innerHTML='<div class="msg">جارٍ التحميل...</div>';
  var p=null,err=null;
  if(/^[A-Za-z0-9]{6}$/.test(h)){
    try{var j=await api('/api/paste/'+h);p={n:j.t,x:j.c,own:j.own}}catch(e){err=e}
  }
  if(!p){
    app.innerHTML='<div class="msg">'+(err&&!err.status?'تعذر الاتصال بالسيرفر 😕':'الرابط غير صالح أو تم حذفه 😕')+'<br><br><button class="tool" id="bk">الصفحة الرئيسية</button></div>';
    $('#bk').onclick=function(){location.hash=''};return;
  }
  var rawUrl=API+'/raw/'+h,ls='loadstring(game:HttpGet("'+rawUrl+'"))()';
  app.innerHTML='<div class="tools"><button class="tool" id="dl">⬇ تنزيل</button><a class="tool" id="rw" href="'+esc(rawUrl)+'" target="_blank" rel="noopener">RAW</a><button class="tool" id="sh">🔗 مشاركة</button><button class="tool" id="cp">📋 نسخ</button><button class="tool" id="ls">▶ loadstring</button>'+(p.own?'<button class="tool" id="ed">✏ تعديل</button>':'')+'</div>'+
  '<p class="title">'+esc(p.n||'file.txt')+'</p><div class="editor"><div class="gut">'+lines(p.x)+'</div><pre class="view" id="pv">'+esc(p.x)+'</pre></div>';
  $('#cp').onclick=function(){copy(p.x)};
  $('#ls').onclick=function(){copy(ls)};
  $('#sh').onclick=function(){copy(location.href)};
  if(p.own)$('#ed').onclick=function(){pre={n:p.n,x:p.x,h:h};location.hash=''};
  $('#dl').onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([p.x],{type:'text/plain'}));a.download=p.n||'file.txt';a.click()};
}

function route(){
  if(!/^https?:\/\//.test(API)||/YOUR-WORKER/.test(API)){
    app.innerHTML='<div class="msg">لازم تحط رابط الـ Worker في أول الملف (السطر اللي فيه <b dir="ltr">var API</b>)</div>';return;
  }
  var h=location.hash.slice(1);
  if(h)show(h);else home();
}
$('#logo').onclick=$('#newBtn').onclick=function(){if(location.hash)location.hash='';else home()};
$('#acc').onclick=function(){me()?accModal():authModal('up')};
window.addEventListener('hashchange',route);
setAcc();route();
})();
</script>
</body>
</html>
